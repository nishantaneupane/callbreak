<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <meta name="theme-color" content="#061638">
  <meta name="description" content="Callbreak, the Nepali card game of calls and tricks. Play online with friends or practice against the computer.">
  <title>Callbreak</title>
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- What WhatsApp, Messenger, Facebook and others show when this page is shared (share.png: the app icon). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Callbreak">
  <meta property="og:title" content="Callbreak: the Nepali card game of calls and tricks">
  <meta property="og:description" content="Play Callbreak free in your browser: online tables with friends, daily bonus and leaderboards, or practice against the computer.">
  <meta property="og:url" content="https://nishantaneupane.github.io/callbreak/">
  <meta property="og:image" content="https://nishantaneupane.github.io/callbreak/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Callbreak: four aces under a gold crown">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://nishantaneupane.github.io/callbreak/share.png">
  <!-- Callbreak's web page (Callbreak > Build Web). The game fills the window; best played in landscape. -->
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #061638; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #F5F9FF; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #061638; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(circle at 50% 45%, #3FA2F0 0%, #11408A 60%, #061638 100%); }
    #loader h1 { margin: 0; font-size: 56px; letter-spacing: 4px; color: #FFC93C; }
    #loader p { margin: 0; color: rgba(219, 235, 227, 0.62); font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
    #bar { width: 260px; height: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
    #fill { width: 0%; height: 100%; border-radius: 999px; background: #FFC93C; transition: width 0.2s; }
    #error { display: none; max-width: 420px; text-align: center; color: #FF6B5E; font-size: 15px; line-height: 1.5; padding: 0 16px; }
    #rotate { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center; background: #061638; color: #F5F9FF; font-size: 18px; padding: 24px; }
    @media (orientation: portrait) and (max-width: 820px) { #rotate.ready { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <h1>CALLBREAK</h1>
    <p>The card game of calls and tricks</p>
    <div id="bar"><div id="fill"></div></div>
    <div id="error"></div>
  </div>
  <div id="rotate">Turn your phone sideways to play</div>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var config = {
      dataUrl: "Build/Web.data.unityweb",
      frameworkUrl: "Build/Web.framework.js.unityweb",
      codeUrl: "Build/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Lampsoft Nepal",
      productName: "Callbreak",
      productVersion: "1.0.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (msg, type) { if (type === "error") showError(msg); else console.log(msg); },
    };

    function showError(msg) {
      var e = document.getElementById("error");
      e.textContent = msg;
      e.style.display = "block";
      document.getElementById("loader").style.display = "flex";
    }

    var script = document.createElement("script");
    script.src = "Build/Web.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.getElementById("fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        document.getElementById("loader").style.display = "none";
        document.getElementById("rotate").classList.add("ready");
      }).catch(function (message) {
        showError("Callbreak couldn't start in this browser: " + message);
      });
    };
    script.onerror = function () { showError("Couldn't load the game files. Check your connection and reload."); };
    document.body.appendChild(script);
  </script>
</body>
</html>
